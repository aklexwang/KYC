<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가맹점 어드민 - KYC 회원 관리</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background: #E8ECF0;
            color: #1a1a1a;
            min-height: 100vh;
        }
        .admin-header {
            background: linear-gradient(135deg, #1A3A5B 0%, #0F2744 100%);
            color: #fff;
            padding: 20px 24px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,.12);
        }
        .admin-header h1 {
            margin: 0 0 4px 0;
            font-size: 22px;
            font-weight: 700;
        }
        .admin-header p {
            margin: 0;
            font-size: 13px;
            opacity: 0.9;
        }
        .admin-body {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .summary-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
        }
        .summary-card .num {
            font-size: 24px;
            font-weight: 700;
            color: #1A2F4A;
        }
        .summary-card .label {
            font-size: 12px;
            color: #6e6e73;
            margin-top: 4px;
        }
        .table-wrap {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
            overflow: hidden;
        }
        .table-scroll {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 560px;
        }
        th {
            background: #1A2F4A;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            padding: 14px 12px;
            white-space: nowrap;
        }
        th:first-child { padding-left: 20px; }
        th:last-child { padding-right: 20px; text-align: center; }
        td {
            padding: 14px 12px;
            border-bottom: 1px solid #E5E5EA;
            font-size: 14px;
        }
        td:first-child { padding-left: 20px; font-weight: 600; color: #1a1a1a; }
        td:last-child { padding-right: 20px; text-align: center; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8f9fa; }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge--complete {
            background: #E8F5E9;
            color: #2E7D32;
        }
        .badge--fail {
            background: #FFEBEE;
            color: #C62828;
        }
        .badge--wait {
            background: #F5F5F5;
            color: #757575;
        }
        .btn-kyc-done {
            display: inline-block;
            padding: 8px 16px;
            background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: default;
            box-shadow: 0 2px 8px rgba(46,125,50,.3);
        }
        .btn-kyc-done:disabled,
        .btn-kyc-done.btn-kyc-done--na {
            background: #E0E0E0;
            color: #9e9e9e;
            box-shadow: none;
        }
        .no-data {
            text-align: center;
            padding: 48px 20px;
            color: #8E8E93;
            font-size: 15px;
        }
        .login-section {
            max-width: 400px;
            margin: 0 auto;
            padding: 48px 24px;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
        }
        .login-card h2 { margin: 0 0 8px 0; font-size: 20px; font-weight: 700; color: #1a1a1a; }
        .login-card .sub { margin: 0 0 24px 0; font-size: 14px; color: #6e6e73; }
        .login-card .field { margin-bottom: 16px; }
        .login-card .field label { display: block; font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
        .login-card .field input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #E5E5EA;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .login-card .btn-login {
            width: 100%;
            padding: 14px;
            background: #1A2F4A;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .login-card .btn-login:hover { opacity: 0.9; }
        .login-card .btn-login:disabled { background: #C7C7CC; cursor: not-allowed; }
        .login-card .error-msg { color: #C62828; font-size: 13px; margin-top: 8px; display: none; }
        .login-card .error-msg.show { display: block; }
        .dashboard-wrap { display: none; }
        .dashboard-wrap.show { display: block; }
        .admin-header .btn-logout {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .admin-header .btn-logout:hover { background: rgba(255,255,255,0.3); }
        .admin-header { position: relative; }
        @media (max-width: 600px) {
            .admin-body { padding: 16px 12px 32px; }
            th, td { padding: 10px 8px; font-size: 13px; }
            td:first-child, th:first-child { padding-left: 12px; }
            td:last-child, th:last-child { padding-right: 12px; }
        }
    </style>
</head>
<body>
    <div id="loginWrap" class="login-section">
        <div class="login-card">
            <h2>가맹점 어드민 로그인</h2>
            <p class="sub">가맹점 ID와 비밀번호를 입력하세요.</p>
            <div class="field">
                <label for="loginStoreId">가맹점 ID</label>
                <input type="text" id="loginStoreId" placeholder="본사에서 발급한 가맹점 ID" autocomplete="username">
            </div>
            <div class="field">
                <label for="loginPassword">비밀번호</label>
                <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password">
            </div>
            <p id="loginError" class="error-msg">가맹점 ID 또는 비밀번호가 올바르지 않습니다.</p>
            <button type="button" class="btn-login" id="btnLogin">로그인</button>
        </div>
    </div>

    <div id="dashboardWrap" class="dashboard-wrap">
    <header class="admin-header">
        <h1>가맹점 어드민</h1>
        <p>KYC 회원 인증 현황 (문자인증 시 입력 이름 기준) — <span id="headerStoreName"></span></p>
        <button type="button" class="btn-logout" id="btnLogout">로그아웃</button>
    </header>
    <main class="admin-body">
        <div class="summary-cards">
            <div class="summary-card">
                <div class="num" id="totalCount">0</div>
                <div class="label">전체 회원</div>
            </div>
            <div class="summary-card">
                <div class="num" id="completeCount">0</div>
                <div class="label">KYC 인증 완료</div>
            </div>
            <div class="summary-card">
                <div class="num" id="progressCount">0</div>
                <div class="label">진행 중</div>
            </div>
        </div>
        <div class="table-wrap">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>회원 (문자인증 이름)</th>
                            <th>문자인증</th>
                            <th>신분증 인증</th>
                            <th>계좌 인증</th>
                            <th>KYC 결과</th>
                        </tr>
                    </thead>
                    <tbody id="memberList">
                        <!-- JS로 채움 -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    </div>

    <script>
        window.ADMIN_API_BASE = window.ADMIN_API_BASE || (typeof location !== 'undefined' ? location.origin : '');
        window.ADMIN_STORE_ID = '';

        var membersFallback = [
            { name: '김철수', sms: 'complete', idDoc: 'complete', account: 'complete' },
            { name: '이영희', sms: 'complete', idDoc: 'complete', account: 'fail' },
            { name: '박민수', sms: 'complete', idDoc: 'fail', account: 'wait' },
            { name: '정수진', sms: 'complete', idDoc: 'wait', account: 'wait' },
            { name: '최동훈', sms: 'complete', idDoc: 'complete', account: 'complete' }
        ];

        function renderBadge(value) {
            if (value === 'complete') return '<span class="badge badge--complete">완료</span>';
            if (value === 'fail') return '<span class="badge badge--fail">실패</span>';
            return '<span class="badge badge--wait">대기</span>';
        }

        function isKycComplete(m) {
            return m.sms === 'complete' && m.idDoc === 'complete' && m.account === 'complete';
        }

        function renderTable(members) {
            var tbody = document.getElementById('memberList');
            tbody.innerHTML = '';
            if (!members || members.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="no-data">등록된 회원이 없습니다.</td></tr>';
            } else {
                members.forEach(function (m) {
                    var tr = document.createElement('tr');
                    tr.innerHTML =
                        '<td>' + (m.name || '-') + '</td>' +
                        '<td>' + renderBadge(m.sms || 'wait') + '</td>' +
                        '<td>' + renderBadge(m.idDoc || 'wait') + '</td>' +
                        '<td>' + renderBadge(m.account || 'wait') + '</td>' +
                        '<td>' + (isKycComplete(m)
                            ? '<span class="btn-kyc-done">KYC 인증 완료</span>'
                            : '<span class="btn-kyc-done btn-kyc-done--na">미완료</span>') + '</td>';
                    tbody.appendChild(tr);
                });
            }
            document.getElementById('totalCount').textContent = members ? members.length : 0;
            document.getElementById('completeCount').textContent = members ? members.filter(isKycComplete).length : 0;
            document.getElementById('progressCount').textContent = members ? members.length - members.filter(isKycComplete).length : 0;
        }

        function loadMembers() {
            if (window.ADMIN_API_BASE && window.ADMIN_STORE_ID) {
                var url = window.ADMIN_API_BASE + '/api/members?store=' + encodeURIComponent(window.ADMIN_STORE_ID);
                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        var list = (data && data.members) ? data.members : [];
                        renderTable(list);
                    })
                    .catch(function () { renderTable(membersFallback); });
            } else {
                renderTable([]);
            }
        }

        function showLogin() {
            document.getElementById('loginWrap').style.display = 'block';
            document.getElementById('dashboardWrap').classList.remove('show');
            window.ADMIN_STORE_ID = '';
        }

        function showDashboard(storeId, storeName) {
            window.ADMIN_STORE_ID = storeId || '';
            document.getElementById('headerStoreName').textContent = storeName || storeId || '';
            document.getElementById('loginWrap').style.display = 'none';
            document.getElementById('dashboardWrap').classList.add('show');
            loadMembers();
        }

        function checkStoredLogin() {
            try {
                var id = sessionStorage.getItem('kyc_store_id');
                var name = sessionStorage.getItem('kyc_store_name');
                var ok = sessionStorage.getItem('kyc_store_logged_in');
                if (id && ok === '1') {
                    showDashboard(id, name || id);
                    return true;
                }
            } catch (e) {}
            showLogin();
            return false;
        }

        document.getElementById('btnLogin').addEventListener('click', function () {
            var storeId = (document.getElementById('loginStoreId').value || '').trim();
            var password = (document.getElementById('loginPassword').value || '').trim();
            var errEl = document.getElementById('loginError');
            var btn = document.getElementById('btnLogin');
            errEl.classList.remove('show');
            if (!storeId || !password) {
                errEl.textContent = '가맹점 ID와 비밀번호를 입력하세요.';
                errEl.classList.add('show');
                return;
            }
            btn.disabled = true;
            var apiBase = window.ADMIN_API_BASE || '';
            fetch(apiBase + '/api/store-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ storeId: storeId, password: password })
            }).then(function (r) { return r.json(); }).then(function (data) {
                btn.disabled = false;
                if (data.error || !data.ok) {
                    errEl.textContent = data.error || '가맹점 ID 또는 비밀번호가 올바르지 않습니다.';
                    errEl.classList.add('show');
                    return;
                }
                sessionStorage.setItem('kyc_store_id', data.storeId || storeId);
                sessionStorage.setItem('kyc_store_name', data.storeName || storeId);
                sessionStorage.setItem('kyc_store_logged_in', '1');
                showDashboard(data.storeId, data.storeName);
            }).catch(function () {
                btn.disabled = false;
                errEl.textContent = '로그인 요청에 실패했습니다.';
                errEl.classList.add('show');
            });
        });

        document.getElementById('btnLogout').addEventListener('click', function () {
            try {
                sessionStorage.removeItem('kyc_store_id');
                sessionStorage.removeItem('kyc_store_name');
                sessionStorage.removeItem('kyc_store_logged_in');
            } catch (e) {}
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginError').classList.remove('show');
            showLogin();
        });

        if (!checkStoredLogin()) {
            document.getElementById('loginWrap').style.display = 'block';
        }
    </script>
</body>
</html>
