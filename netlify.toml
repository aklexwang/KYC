# Netlify 설정
[build]
  publish = "."

# 로컬: npm run dev → scripts/local-dev-server.js (Netlify CLI 불필요)
# 대안: npm run dev:netlify (npx netlify-cli, 느리거나 멈출 수 있음)
[dev]
  framework = "#static"
  publish = "."
  functions = "netlify/functions"
  port = 8888

[[redirects]]
  from = "/api/kyc"
  to = "/.netlify/functions/kyc"
  status = 200
  force = true

